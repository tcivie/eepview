version = 1

# Files that cannot hold a comment header: JSON, images, lock files, text and dotfiles.
[[annotations]]
path = [
  "**/*.json",
  "**/*.png",
  "**/*.svg",
  "**/*.ico",
  "**/*.icns",
  "**/*.lock",
  "**/*.txt",
  "**/.gitignore",
  ".editorconfig",
  ".github/CODEOWNERS",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The eepview contributors"
SPDX-License-Identifier = "MIT"

# Documentation: the wiki source and the root Markdown files.
[[annotations]]
path = ["**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The eepview contributors"
SPDX-License-Identifier = "MIT"

# Permission files that tauri-build generates (src-tauri/build.rs); a header would be lost on
# the next build.
[[annotations]]
path = ["src-tauri/permissions/autogenerated/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The eepview contributors"
SPDX-License-Identifier = "MIT"
