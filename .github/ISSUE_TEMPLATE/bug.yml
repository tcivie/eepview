name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: eepview version
    validations:
      required: true
  - type: dropdown
    id: router
    attributes:
      label: Router type
      options:
        - Java I2P
        - i2pd
        - Managed
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
