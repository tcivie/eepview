name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: eepview version
    validations:
      required: true
  - type: dropdown
    id: router
    attributes:
      label: Router type
      options:
        - Java I2P
        - i2pd
        - Managed
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? Do not include site addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: eepview fills this in when you use "Report a problem". It holds no addresses and no names. Drag the saved report file here to attach the full text.
      render: text
    validations:
      required: false
