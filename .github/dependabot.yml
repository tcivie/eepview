version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
