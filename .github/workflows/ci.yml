name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  coverage:
    name: coverage (rust + typescript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # tauri::generate_context! needs the built frontend (dist) to compile.
      - run: npm run build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      # Ratchet: raise these numbers when coverage rises. Never lower them.
      # See docs/wiki/coverage.md.
      - name: Rust line coverage gate
        working-directory: src-tauri
        # The gate is on the run itself: `report` has no --workspace and would gate the root crate only.
        run: cargo llvm-cov --workspace --all-targets --summary-only --fail-under-lines 93
      # Branch coverage needs a nightly compiler. One dated nightly is used for this
      # measurement only; everything else builds on the pinned stable toolchain.
      - name: Install the pinned nightly for branch coverage
        run: rustup toolchain install nightly-2026-10-01 --profile minimal --component llvm-tools-preview
      # cargo-llvm-cov has no --fail-under-branches, so jq reads the workspace total from the
      # JSON summary of the same run and prints it before the check.
      - name: Rust branch coverage gate
        working-directory: src-tauri
        run: |
          cargo +nightly-2026-10-01 llvm-cov --workspace --all-targets --branch --json --summary-only --output-path "$RUNNER_TEMP/branch.json"
          jq -r -e '.data[0].totals.branches.percent | "branch coverage: \(.)% (floor 82)", . >= 82' "$RUNNER_TEMP/branch.json"
      - run: npm run test:coverage

  # Not a required check yet. See docs/wiki/reproducible-builds.md.
  reproducible:
    name: reproducible (ubuntu-24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK build dependencies and diffoscope
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev diffoscope-minimal
      - name: Install the pinned Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Two clean builds in two directories; same overrides as the Linux leg of release.yml.
      - name: Build twice and compare
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: ./scripts/repro-check.sh "$RUNNER_TEMP/repro"
