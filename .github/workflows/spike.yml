name: spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/spike.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: webview proxy probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        include:
          - os: ubuntu-24.04
            modes: default,hardened,js-off
          - os: macos-15
            modes: default,hardened,js-off
          - os: windows-2025
            modes: default,hardened,js-off,win-trap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK, Xvfb and strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb strace
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spike/probe
      - name: Build the probe
        run: cargo build --manifest-path spike/probe/Cargo.toml --locked
      - name: Run the harness
        shell: bash
        working-directory: spike/probe
        env:
          MODES: ${{ matrix.modes }}
        run: |
          py="$(command -v python3 || command -v python)"
          args=(--binary target/debug/eepview-probe --modes "$MODES" --seconds 15)
          if [ "$RUNNER_OS" = Linux ]; then args+=(--xvfb --strace); fi
          if [ "$RUNNER_OS" = Windows ]; then args[1]=target/debug/eepview-probe.exe; fi
          "$py" harness.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-results-${{ matrix.os }}
          path: |
            spike/probe/probe-results.json
            spike/probe/strace.*.log
          if-no-files-found: warn
