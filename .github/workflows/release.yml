name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but do not create a release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is on main and passed every required check
        # A branch dry run tests a pipeline change before merge, so the gate skips it.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: ./scripts/release-gates.sh

  build:
    name: build (${{ matrix.target }})
    needs: gates
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # strip and split_debuginfo override the release profile per OS, so each OS keeps its debug symbols:
          # MSVC writes no .pdb when cargo strips, and on Linux objcopy splits the symbols after the build.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            strip: none
            split_debuginfo: packed
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            strip: symbols
            split_debuginfo: packed
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
            strip: symbols
            split_debuginfo: packed
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            strip: none
            split_debuginfo: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install the pinned Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # SOURCE_DATE_EPOCH, CARGO_INCREMENTAL=0 and --remap-path-prefix. See docs/wiki/reproducible-builds.md.
      - name: Set the reproducible build environment
        shell: bash
        run: ./scripts/repro-env.sh >> "$GITHUB_ENV"
      - name: Build the release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.strip }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ matrix.split_debuginfo }}
        run: npx tauri build --target "$TARGET" --no-bundle -- --locked
      - name: Split the debug symbols into a release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/split-debug.sh "$TARGET" symbols
      - name: Check PIE, RELRO and NX on the Linux binary
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/check-hardening.sh "src-tauri/target/$TARGET/release/eepview"
      - name: Build bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: npx tauri bundle --target "$TARGET" --bundles "$BUNDLES"
      # The bundler signs the .app with the ad-hoc identity set in tauri.conf.json, before it builds the dmg.
      # A real Developer ID signature and notarization are not set up yet.
      - name: Verify the app inside the dmg is ad-hoc signed
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/verify-dmg-signature.sh "src-tauri/target/$TARGET/release/bundle/dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            symbols/*
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Rust SBOM
        working-directory: src-tauri
        run: cargo cyclonedx --format json
      - name: npm SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > npm.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            src-tauri/*.cdx.json
            npm.cdx.json
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # A dry run, or a dispatch run on a branch, signs and verifies the files but never attests or releases.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Flatten and write checksums
        working-directory: dist
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -l
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the job's OIDC token gets a short-lived Fulcio certificate, and Rekor logs each signature.
      - name: Sign every release file with Sigstore
        working-directory: dist
        run: |
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Verify every signature against this workflow
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for bundle in *.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.RELEASE == 'true'
        with:
          subject-path: |
            dist/*
            !dist/*.sigstore.json
      - name: Create draft release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --generate-notes dist/*
