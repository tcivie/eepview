name: dco

on:
  pull_request:

permissions: {}

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit has a Signed-off-by line that matches its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "skip: the pull request is from dependabot"
            exit 0
          fi
          status=0
          while read -r sha; do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "ok   $sha"
            else
              echo "error: $sha has no 'Signed-off-by: $author' line. Use git commit -s." >&2
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$status"
