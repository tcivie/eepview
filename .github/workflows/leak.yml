name: leak

# The permanent leak test from docs/wiki/adr-0001-no-leak-architecture.md. It runs the real
# release binary against a fake I2P proxy and canaries, on every OS. Required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  # A literal prefix: under workflow_call, github.workflow is the caller's name.
  group: leak-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: leak harness (ruff + unit tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ruff check + format
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/pip" install --quiet --no-deps --require-hashes -r tests/leak/requirements-lint.txt
          "$RUNNER_TEMP/ruff-venv/bin/ruff" check tests/leak
          "$RUNNER_TEMP/ruff-venv/bin/ruff" format --check tests/leak
      - name: Unit tests for the harness
        run: python3 -m unittest discover -s tests/leak -v

  leak-test:
    name: leak-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each OS runs the form of the app that users run. macOS needs the .app: its Info.plist
        # turns on App Transport Security, which a bare binary never meets (the tabs-never-load
        # bug of #85). See docs/wiki/leak-test.md for why Linux and Windows run the binary.
        include:
          - os: ubuntu-24.04
            build_args: --no-bundle
            binary: src-tauri/target/release/eepview
            harness_args: --xvfb --strace
          - os: macos-15
            build_args: --bundles app
            binary: src-tauri/target/release/bundle/macos/eepview.app/Contents/MacOS/eepview
            harness_args: ""
          - os: windows-2025
            build_args: --no-bundle
            binary: src-tauri/target/release/eepview.exe
            harness_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Negative control (the detectors must fire)
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" tests/leak/harness.py --negative-control --out leak-control
      - name: Install WebKitGTK, Xvfb and strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb strace
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the release app
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          read -ra build <<<"$BUILD_ARGS"
          npm run tauri -- build "${build[@]}" -- --locked
      - name: Check PIE, RELRO and NX on the Linux binary
        if: runner.os == 'Linux'
        run: ./scripts/check-hardening.sh src-tauri/target/release/eepview
      - name: Run the leak test
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          HARNESS_ARGS: ${{ matrix.harness_args }}
        run: |
          set -o pipefail
          py="$(command -v python3 || command -v python)"
          read -ra extra <<<"$HARNESS_ARGS"
          "$py" tests/leak/harness.py --binary "$BINARY" --out leak-results "${extra[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the leak logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leak-results-${{ matrix.os }}
          path: |
            leak-control/
            leak-results/
          if-no-files-found: warn
          retention-days: 7
