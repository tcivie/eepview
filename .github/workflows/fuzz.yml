# Continuous fuzzing with ClusterFuzzLite. See docs/wiki/fuzzing.md.
# A pull request gets a short run on the code it changes. Main gets a longer batch run every
# day. The batch run keeps its corpus in the Actions cache. This workflow is not a required check.
name: fuzz

on:
  # Nightly on main, and on demand. The heavy lane and the fast lane do not wait for it.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (batch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # check out the repository
      actions: read # list the earlier corpus and crash artifacts of the repository
    env:
      MODE: batch
      # Total time for all four targets: 15 minutes each.
      FUZZ_SECONDS: "3600"
    steps:
      # The workspace must hold the repository: ClusterFuzzLite reads .clusterfuzzlite/project.yaml
      # from it to pick the Ubuntu 24.04 build and run images.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          fuzz-seconds: ${{ env.FUZZ_SECONDS }}
          mode: ${{ env.MODE }}
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Upload the crash inputs
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: ./out/artifacts
          if-no-files-found: ignore
