<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eepview bulb preview</title>
    <!-- Open with #light or #dark to force a theme. Without a fragment the page follows the system. -->
    <style>
      :root { --bg: #f4f2ec; --surface: #ffffff; --ink: #12302a; --muted: #5f6b66; --rule: #dfe3dc; }
      @media (prefers-color-scheme: dark) {
        :root:not(:has(#light:target)) { --bg: #0d1a16; --surface: #14241f; --ink: #eef2ea; --muted: #93a39b; --rule: #2a3d36; }
      }
      :root:has(#dark:target) { --bg: #0d1a16; --surface: #14241f; --ink: #eef2ea; --muted: #93a39b; --rule: #2a3d36; }
      .logo-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not(:has(#light:target)) .logo-light { display: none; }
        :root:not(:has(#light:target)) .logo-dark { display: block; }
      }
      :root:has(#dark:target) .logo-light { display: none; }
      :root:has(#dark:target) .logo-dark { display: block; }
      body { margin: 0; padding: 40px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 24px; font-size: 20px; font-weight: 600; }
      h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .grid { display: grid; grid-template-columns: 512px 1fr; gap: 32px; }
      .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
      .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
      .size { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
      .mono { display: block; color: var(--ink); }
    </style>
  </head>

    <span id="light"></span><span id="dark"></span>
    <h1>eepview: Garlic bulb</h1>
    <div class="grid">
      <div>
        <h2>Master mark, 512 px</h2>
        <img src="eepview-mark.svg" width="512" height="512" alt="eepview bulb mark" />
      </div>
      <div>
        <div class="card">
          <h2>Master mark</h2>
          <div class="row">
            <div class="size"><img src="eepview-mark.svg" width="256" height="256" alt="" />256</div>
            <div class="size"><img src="eepview-mark.svg" width="128" height="128" alt="" />128</div>
          </div>
        </div>
        <div class="card">
          <h2>Small-size mark</h2>
          <div class="row">
            <div class="size"><img src="eepview-mark-small.svg" width="64" height="64" alt="" />64</div>
            <div class="size"><img src="eepview-mark-small.svg" width="48" height="48" alt="" />48</div>
            <div class="size"><img src="eepview-mark-small.svg" width="32" height="32" alt="" />32</div>
            <div class="size"><img src="eepview-mark-small.svg" width="24" height="24" alt="" />24</div>
            <div class="size"><img src="eepview-mark-small.svg" width="16" height="16" alt="" />16</div>
          </div>
        </div>

        </div>
        <div class="card">
          <h2>Horizontal logo</h2>
          <img class="logo-light" src="eepview-logo-horizontal-light.svg" width="406" height="90" alt="eepview" />
