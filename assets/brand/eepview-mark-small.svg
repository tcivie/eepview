<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>eepview mark, small sizes</title>
  <!-- Every coordinate is a multiple of 64, so each edge lands on a whole pixel at 16 px (and 32 px).
       The root and the neck start inside the bulb and are drawn first, so the bulb covers each joint. -->
  <rect width="1024" height="1024" rx="192" fill="#1F5A48"/>
  <path d="M448 768H576V896H448Z" fill="#A9845A"/>
  <path d="M448 384L512 128L576 384Z" fill="#EDE0C3"/>
  <path d="M448 320C256 384 192 512 192 640C192 768 320 832 448 832H576C704 832 832 768 832 640C832 512 768 384 576 320Z" fill="#FBF6EA"/>
  <path d="M512 320C576 448 576 640 576 832H448C448 640 448 448 512 320Z" fill="#EDE0C3"/>
  <path d="M576 320C768 384 832 512 832 640C832 768 704 832 576 832C640 640 640 448 576 320Z" fill="#D3BD94"/>
</svg>
