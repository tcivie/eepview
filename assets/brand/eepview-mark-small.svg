<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>eepview mark, small sizes</title>
  <!-- Every coordinate is a multiple of 64, so each edge lands on a whole pixel at 16 px (and 32 px). -->
  <rect width="1024" height="1024" rx="192" fill="#1D5444"/>
  <rect x="128" y="192" width="768" height="640" rx="64" fill="#F3EDE0"/>
  <rect x="192" y="320" width="640" height="448" rx="64" fill="#0D2A23"/>
  <path d="M448 448C384 448 320 512 320 576C320 640 384 704 448 704H576C640 704 704 640 704 576C704 512 640 448 576 448Z" fill="#D3BD94"/>
  <path d="M512 448C576 512 576 640 576 704H448C448 640 448 512 512 448ZM448 448L512 384L576 448Z" fill="#FBF6EA"/>
  <path d="M448 704H576V768H448Z" fill="#8A6C47"/>
</svg>
