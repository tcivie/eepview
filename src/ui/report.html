<html lang="en">
  <head>
    <script src="/theme-boot.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Report a problem</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./ui.css" />
    <link rel="stylesheet" href="./pages.css" />
    <script type="module" src="./report.ts"></script>
  </head>
  <body>
    <main class="notice report" id="main">
      <h1>Report a problem</h1>
      <p class="notice-lede">
        Tell us what went wrong. eepview adds a short log that holds no addresses and no names.
      </p>

      <form class="report-form" id="report-form">
        <div class="field">
          <label class="field-label" for="report-description">What happened</label>
          <textarea
            class="input report-text"
            id="report-description"
            rows="5"
            placeholder="What did you do, and what went wrong? Do not include site addresses."
          ></textarea>
        </div>

        <label class="check">
          <input type="checkbox" id="report-include-log" checked />
          <span class="check-text">Include the diagnostics log</span>
          <span class="check-hint">The last 200 events: event names, states and numbers only.</span>
        </label>

        <div class="field">
          <label class="field-label" for="report-preview">This exact text goes into the issue</label>
          <textarea class="input report-text report-preview" id="report-preview" rows="12" readonly></textarea>
        </div>

        <p class="notice-hint" id="report-note">
          This opens GitHub in your normal web browser, outside I2P. GitHub sees your IP address and
          your GitHub account. Nothing is sent until you submit the issue on GitHub.
        </p>

        <div class="actions notice-actions">
          <button class="btn btn-primary" type="submit" id="report-open">Open a GitHub issue</button>
        </div>
      </form>

      <p class="notice-hint" id="report-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
