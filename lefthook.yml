# Fast checks before each commit. CI runs the full set and is the real gate.
# Install once per clone: `lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: |
        cargo fmt --manifest-path src-tauri/Cargo.toml --check
        cargo fmt --manifest-path spike/probe/Cargo.toml --check
    - name: biome
      glob: "*.{ts,js,json,html,css}"
      run: npx biome check --no-errors-on-unmatched {staged_files}
    - name: taplo
      glob: "*.toml"
      run: taplo fmt --check {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: complexity
      glob: "*.{rs,ts,py}"
      run: ./scripts/complexity.sh
    - name: gitleaks
      run: gitleaks git --staged --no-banner --redact
