# git-cliff config. It writes the changelog and the release notes from the Conventional Commit
# titles on main. Run `scripts/changelog.sh` to regenerate CHANGELOG.md.

[changelog]
header = """
# Changelog

git-cliff generates this changelog from the Conventional Commit titles on `main`. \
The release job writes the release notes from the same titles. Do not edit it by hand. See [Release pipeline](docs/wiki/release-pipeline.md).

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/). \
This project follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]"
# Link each PR number `(#N)` to its pull request.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/tcivie/eepview/pull/${1}))" },
]
# The group names start with an HTML comment that sets the section order. The template strips it.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^Revert ", skip = true },
  { message = "^chore(\\(.*\\))?: initial commit", skip = true },
  { message = "^feat(\\(.*\\))?!?:", group = "<!-- 0 -->Added" },
  { message = "^fix(\\(.*\\))?!?:", group = "<!-- 1 -->Fixed" },
  { message = "^security(\\(.*\\))?!?:", group = "<!-- 2 -->Security" },
  { message = "^perf(\\(.*\\))?!?:", group = "<!-- 3 -->Changed" },
  { message = "^refactor(\\(.*\\))?!?:", group = "<!-- 3 -->Changed" },
  { message = "^docs(\\(.*\\))?!?:", group = "<!-- 5 -->Documentation" },
  { message = "^ci(\\(.*\\))?!?:", group = "<!-- 6 -->CI" },
  { message = "^test(\\(.*\\))?!?:", group = "<!-- 7 -->Tests" },
  { message = "^chore(\\(.*\\))?!?:", group = "<!-- 8 -->Maintenance" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
