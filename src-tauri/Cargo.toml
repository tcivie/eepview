[package]
name = "eepview"
version = "0.1.0"
description = "A small browser that opens I2P sites only"
authors = ["Gleb Tcivie"]
license = "MIT"
repository = "https://github.com/tcivie/eepview"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]
members = ["crates/eepview-platform"]

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (cargo#8519 on Windows).
name = "eepview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# The mock runtime (`tauri::test`) for the shell tests.
tauri = { version = "2", default-features = false, features = ["test", "unstable", "wry"] }
# Property tests for the diagnostics privacy rules (tests/diag_scrub.rs, tests/diag_report.rs).
# No default features: no fork, no timeout, no file persistence of failures.
proptest = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri default features without `compression` (brotli for the embedded assets), `dbus`
# (Linux theme portal) and `dynamic-acl` (capabilities added at runtime; eepview only
# uses the static capabilities in capabilities/).
# `unstable` gives one window with several webviews; `macos-proxy` gives `proxy_url` on macOS 14+.
tauri = { version = "2", default-features = false, features = [
  "common-controls-v6",
  "macos-proxy",
  "unstable",
  "wry",
  "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eepview-platform = { path = "crates/eepview-platform" }
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the diagnostics files: a symbolic link in their place is never followed.
# Already in the tree through Tauri.
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Complexity limits; thresholds live in clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"
# No panics in production code; tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Repeatable and hardened. See docs/wiki/reproducible-builds.md.
[profile.release]
# One codegen unit gives one fixed order of functions in the binary.
codegen-units = 1
lto = "thin"
opt-level = 3
# Tauri supports abort; the app sets no panic hook that needs unwinding.
panic = "abort"
overflow-checks = true
# Keep function names and line tables, then move them out of the binary:
# macOS writes eepview.dSYM, Windows writes eepview.pdb, and on Linux CI runs objcopy
# (scripts/split-debug.sh). The release uploads these files.
debug = "limited"
split-debuginfo = "packed"
strip = "symbols"
