[package]
name = "eepview"
version = "0.1.0"
description = "A small browser that opens I2P sites only"
authors = ["Gleb Tcivie"]
license = "MIT"
repository = "https://github.com/tcivie/eepview"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]
members = ["crates/eepview-platform"]

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (cargo#8519 on Windows).
name = "eepview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Property tests of the robustness suite (tests/robust_*.rs), the site icons
# (tests/site_icons_props.rs), the popup placement (tests/popups.rs) and the router console
# navigation route (R10). No default features: no fork, no timeout.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# The L3 rule is a regex; the tests run the real rule against the same URLs as the guard.
# Already in the tree through Tauri.
regex = { version = "1", default-features = false, features = ["std"] }
# The mock runtime (`tauri::test`) for the shell tests.
tauri = { version = "2", default-features = false, features = ["test", "unstable", "wry"] }
# Real PNG, ICO, GIF, JPEG, WebP and BMP bytes for the site icon tests (tests/site_icons_*.rs).
image = { version = "0.25", default-features = false, features = [
  "png",
  "ico",
  "gif",
  "jpeg",
  "webp",
  "bmp",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri default features without `compression` (brotli for the embedded assets), `dbus`
# (Linux theme portal) and `dynamic-acl` (capabilities added at runtime; eepview only
# uses the static capabilities in capabilities/).
# `unstable` gives one window with several webviews; `macos-proxy` gives `proxy_url` on macOS 14+.
tauri = { version = "2", default-features = false, features = [
  "common-controls-v6",
  "macos-proxy",
  "unstable",
  "wry",
  "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eepview-platform = { path = "crates/eepview-platform" }
# Site icons: decode PNG, ICO, GIF, JPEG and WebP and draw them again as new PNG files
# (docs/wiki/site-icons.md). No default features: no rayon, no other formats.
image = { version = "0.25", default-features = false, features = [
  "png",
  "ico",
  "gif",
  "jpeg",
  "webp",
] }
# The SHA-256 file names of the icon files, so no host name reaches the disk.
sha2 = "0.10"
# The `data:image/png;base64,` URLs the UI gets.
base64 = "0.23"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Complexity limits; thresholds live in clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"
# No panics in production code; tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Repeatable and hardened. See docs/wiki/reproducible-builds.md.
[profile.release]
# One codegen unit gives one fixed order of functions in the binary.
codegen-units = 1
lto = "thin"
opt-level = 3
# Tauri supports abort; the app sets no panic hook that needs unwinding.
panic = "abort"
overflow-checks = true
# Keep function names and line tables, then move them out of the binary:
# macOS writes eepview.dSYM, Windows writes eepview.pdb, and on Linux CI runs objcopy
# (scripts/split-debug.sh). The release uploads these files.
debug = "limited"
split-debuginfo = "packed"
strip = "symbols"
