# cargo-nextest runs each test in its own process. Tests that wait on a timer or a socket then do
# not hold each other up, as they do in the one process of `cargo test`. See docs/wiki/testing-policy.md.

[profile.default]
# A test that runs longer than 2 minutes hangs. nextest stops it and reports it.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# Run every test, and print the output of each failure at the moment it fails and again at the end.
fail-fast = false
failure-output = "immediate-final"

# Tests that bind the default router console ports of this machine (7657 and 7070). In one
# process the detect lock keeps them apart. Across nextest processes this group does: one runs
# at a time, so none of them finds a port taken by another.
[test-groups]
console-ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/^net::console::tests::r(6|20|21|22)_/) | test(=shell::commands::tests::router_stats_command::r45_after_detect_now_the_console_is_queried_again)"
test-group = "console-ports"
