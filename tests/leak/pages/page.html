<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>eepview leak test</title>
    <link rel="dns-prefetch" href="//dns-prefetch.clear.example" />
    <link rel="preconnect" href="http://preconnect.clear.example" />

    <img src="http://localhost:__CANARY__/img-localhost" alt="" />
    <img src="http://__LAN_TCP__/img-lan" alt="" />
    <img src="/redirect" alt="" />
    <iframe src="http://frame.leaktest.i2p/frame.html" title="cross-origin frame"></iframe>
    <form id="clearnet-form" action="http://form.clear.example/submit" method="post">
      <input type="hidden" name="leak" value="1" />
    </form>
    <a id="blank-link" href="http://blank.clear.example/" target="_blank" rel="noopener">blank</a>
